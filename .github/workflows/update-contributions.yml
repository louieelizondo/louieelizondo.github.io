name: Update contribution calendar

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build contributions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributions.py

      - name: Commit if the trail changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/contributions.json
          if git diff --cached --quiet; then
            echo "Calendar unchanged"
          else
            git commit -m "chore: refresh contribution calendar"
            git push
          fi
